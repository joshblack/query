[package]
name = "query"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
globset = "0.4.21"
ignore = "0.4.34"
line-index = "0.1.2"
oxc_allocator = "0.158.0"
oxc_ast = "0.158.0"
oxc_ast_visit = "0.158.0"
oxc_diagnostics = "0.158.0"
oxc_parser = "0.158.0"
oxc_semantic = "0.158.0"
oxc_span = "0.158.0"
petgraph = "0.8.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
anyhow = "1.0.104"
tempfile = "3.27.0"
