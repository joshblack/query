[tools]
rust = { version = "1.98.0", components = ["clippy"] }
"cargo:cargo-nextest" = "latest"
"cargo:cargo-shear" = "latest"

[tasks.fmt]
run = "cargo fmt --check"

[tasks.lint]
run = "cargo clippy --all-targets -- -D warnings"

[tasks.lint-deps]
run = "cargo shear"

[tasks.test]
run = "cargo nextest run"
