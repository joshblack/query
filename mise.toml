[settings]
idiomatic_version_file_enable_tools = ["rust"]
cargo.binstall_only = true

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tools]
"npm:npm" = "12.2.2"
mr-boxington = { version = "1.30.0", postinstall = "mbx setup --yes" }
cargo-binstall = "1.27.0"
"cargo:cargo-nextest" = { version = "0.9.152", lazy = true, lazy_bins = ["cargo-nextest"] }

[tasks.fmt]
run = "cargo fmt --all --check"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
run = "cargo nextest run --workspace --no-fail-fast"

